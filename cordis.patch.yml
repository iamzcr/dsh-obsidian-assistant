# The dsh-obsidian-assistant bundle patch: inserts one toolset plugin into a
# profile tree. Applied AFTER the base bundle (it injects `tools` + `fs`), this
# row adds the eleven obsidian_* tools to the shared tool registry.
#
# To use, add "dsh-obsidian-assistant" to your profile's `dsh.profile.bundles`
# (or install it into `$DSH_HOME/profiles/<name>/node_modules`), then provide
# your vault path in your profile's cordis.patch.yml — `vaultPath` has no
# portable default, so it is left out here on purpose. A later layer may target
# this row by id `dsh-obsidian-assistant` to change config or disable it.
#
# Minimal example (your profile's cordis.patch.yml):
#   - id: dsh-obsidian-assistant
#     config:
#       vaultPath: 'D:/my-notes'   # required: absolute path to your vault root

- insert:
    - id: dsh-obsidian-assistant
      name: 'dsh-obsidian-assistant'
